<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="450" height="200">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e23636"/>
      <stop offset="100%" stop-color="#1b3f8b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c542"/>
      <stop offset="100%" stop-color="#d4a317"/>
    </linearGradient>
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Trophy graphic symbol -->
    <g id="trophy-shape">
      <!-- Cup -->
      <path d="M -12 -12 L 12 -12 L 10 2 C 10 7, 5 12, 0 12 C -5 12, -10 7, -10 2 Z" fill="url(#goldGrad)"/>
      <!-- Handles -->
      <path d="M -12 -10 C -17 -10, -17 -2, -10 0" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <path d="M 12 -10 C 17 -10, 17 -2, 10 0" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <!-- Stand -->
      <path d="M -2 12 L 2 12 L 4 18 L -4 18 Z" fill="url(#goldGrad)"/>
      <rect x="-10" y="18" width="20" height="6" rx="1" fill="#1b3f8b"/>
    </g>
  </defs>

  <style>
    .card-bg { fill: #0a0e17; stroke: url(#borderGrad); stroke-width: 1.5; }
    .title { fill: #ff4d4d; font-family: sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.5; }
    .web-corner { stroke: #e23636; stroke-width: 0.8; opacity: 0.2; fill: none; }
    
    .trophy-box { fill: #0d131f; stroke: #1b3f8b; stroke-width: 1; }
    .t-title { fill: #f5f5f5; font-family: sans-serif; font-weight: bold; font-size: 11px; text-anchor: middle; }
    .t-desc { fill: #ff4d4d; font-family: sans-serif; font-weight: bold; font-size: 9px; text-anchor: middle; }
    .t-rank { fill: #f4c542; font-family: sans-serif; font-weight: 900; font-size: 14px; text-anchor: middle; }

    /* Pop animations */
    .trophy-cell {
      transform-origin: center;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    /* Thwip starburst animation */
    .thwip {
      animation: thwipFX 0.4s ease-out both;
      transform-origin: center;
    }
    @keyframes thwipFX {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .shine {
      animation: shine 3s ease-in-out infinite;
    }
    @keyframes shine {
      0% { transform: translateX(-100px) translateY(-100px) rotate(45deg); }
      30%, 100% { transform: translateX(150px) translateY(150px) rotate(45deg); }
    }
  </style>

  <!-- Card Background -->
  <rect class="card-bg" x="2" y="2" width="446" height="196" rx="10"/>

  <!-- Web doodles in corners -->
  <path class="web-corner" d="M 2 2 L 0 50 M 2 2 L 50 0 M 2 2 L 35 35 M 448 2 L 448 50 M 448 2 L 398 0 M 448 2 L 413 35 M 2 198 L 0 148 M 2 198 L 50 200 M 2 198 L 35 163 M 448 198 L 448 148 M 448 198 L 398 200 M 448 198 L 413 163"/>

  <!-- Title -->
  <text x="30" y="35" class="title">TROPHY VAULT</text>

  <!-- Trophy 1: Commits -->
  <g class="trophy-cell" style="animation-delay: 0.2s;" transform="translate(30, 50)">
    <rect class="trophy-box" x="0" y="0" width="110" height="120" rx="8"/>
    <!-- Trophy graphic -->
    <use href="#trophy-shape" x="55" y="45"/>
    <text x="55" y="85" class="t-title">Super-Committer</text>
    <text x="55" y="100" class="t-desc">1,000+ Commits</text>
    <text x="55" y="112" class="t-rank">RANK A+</text>
    <!-- Thwip burst effect overlay -->
    <path class="thwip" d="M 55 45 L 57 25 L 60 45 L 80 47 L 60 50 L 57 70 L 54 50 L 34 47 Z" fill="#ff4d4d" style="animation-delay: 0.6s;"/>
  </g>

  <!-- Trophy 2: PRs -->
  <g class="trophy-cell" style="animation-delay: 0.4s;" transform="translate(170, 50)">
    <rect class="trophy-box" x="0" y="0" width="110" height="120" rx="8"/>
    <use href="#trophy-shape" x="55" y="45"/>
    <text x="55" y="85" class="t-title">PR Master</text>
    <text x="55" y="100" class="t-desc">Open Source Contrib</text>
    <text x="55" y="112" class="t-rank">RANK S</text>
    <path class="thwip" d="M 55 45 L 57 25 L 60 45 L 80 47 L 60 50 L 57 70 L 54 50 L 34 47 Z" fill="#ff4d4d" style="animation-delay: 0.8s;"/>
  </g>

  <!-- Trophy 3: Star-Gazer -->
  <g class="trophy-cell" style="animation-delay: 0.6s;" transform="translate(310, 50)">
    <rect class="trophy-box" x="0" y="0" width="110" height="120" rx="8"/>
    <use href="#trophy-shape" x="55" y="45"/>
    <text x="55" y="85" class="t-title">Friendly Dev</text>
    <text x="55" y="100" class="t-desc">High Engagement</text>
    <text x="55" y="112" class="t-rank">RANK A</text>
    <path class="thwip" d="M 55 45 L 57 25 L 60 45 L 80 47 L 60 50 L 57 70 L 54 50 L 34 47 Z" fill="#ff4d4d" style="animation-delay: 1.0s;"/>
  </g>
</svg>